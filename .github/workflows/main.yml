          package com.example
          
          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          
          /**
           * Dịch vụ lắng nghe thông báo thời gian thực trên điện thoại Android (Zalo, Messenger, Facebook, SMS, Telegram...)
           * và tự động đóng gói JSON gửi xuống ESP32 qua BLE để kích hoạt hiệu ứng 3D Corner Popup trên màn OLED 0.96 inch.
           */
          class SmartWatchNotificationService : NotificationListenerService() {
          
              private var lastNotificationSignature: String = ""
              private var lastNotificationTimeMs: Long = 0L
          
              override fun onCreate() {
                  super.onCreate()
                  Esp32BleController.loadPreferences(applicationContext)
              }
          
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn == null) return
                  if (sbn.isOngoing) return // Bỏ qua các thông báo hệ thống chạy ngầm cố định
          
                  val pkg = sbn.packageName ?: return
                  val currentState = Esp32BleController.state.value
          
                  val appDisplayName = when {
                      pkg.contains("com.zing.zalo", ignoreCase = true) -> {
                          if (!currentState.enableZalo) return
                          "Zalo"
                      }
                      pkg.contains("com.facebook.orca", ignoreCase = true) ||
                          pkg.contains("com.facebook.mlite", ignoreCase = true) -> {
                          if (!currentState.enableMessenger) return
                          "Messenger"
                      }
                      pkg.contains("com.facebook.katana", ignoreCase = true) ||
                          pkg.contains("com.facebook.lite", ignoreCase = true) -> {
                          if (!currentState.enableFacebook) return
                          "Facebook"
                      }
                      pkg.contains("org.telegram", ignoreCase = true) -> {
                          if (!currentState.enableTelegram) return
                          "Telegram"
                      }
                      pkg.contains("messaging", ignoreCase = true) ||
                          pkg.contains("mms", ignoreCase = true) ||
                          pkg.contains("sms", ignoreCase = true) -> {
                          if (!currentState.enableSms) return
                          "SMS"
                      }
                      else -> return
                  }
          
                  val extras = sbn.notification?.extras ?: return
                  val rawTitle = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString()?.trim().orEmpty()
                  val rawBigText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString()?.trim()
                  val rawText = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString()?.trim()
                  val messageContent = (rawBigText ?: rawText).orEmpty()
          
                  if (rawTitle.isBlank() && messageContent.isBlank()) return
          
                  // Lọc bỏ thông báo hệ thống phụ của Messenger/Zalo (ví dụ: "Bong bóng chat đang bật", "Đang kết nối...")
                  val lowerMsg = messageContent.lowercase()
                  if (lowerMsg.contains("chat heads active") ||
                      lowerMsg.contains("bong bóng chat") ||
                      lowerMsg.contains("đang chạy trong nền")
                  ) {
                      return
                  }
          
                  // Chống lặp thông báo giống hệt nhau trong 2 giây
                  val now = System.currentTimeMillis()
                  val signature = "$appDisplayName|$rawTitle|$messageContent"
                  if (signature == lastNotificationSignature && (now - lastNotificationTimeMs) < 2000L) {
                      return
                  }
                  lastNotificationSignature = signature
                  lastNotificationTimeMs = now
          
                  Esp32BleController.sendPhoneNotification(
                      appName = appDisplayName,
                      sender = rawTitle.ifBlank { appDisplayName },
                      message = messageContent
                  )
              }
          }
