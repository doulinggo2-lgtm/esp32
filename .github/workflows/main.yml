                  val updated = listOf(
                      ScannedWifiNetwork("VNPT_5G_Home", (-44 + jitter).coerceIn(-90, -30), true),
                      ScannedWifiNetwork("FPT_Telecom_Tang2", (-57 + jitter).coerceIn(-90, -30), true),
