           * với đầy đủ hiệu ứng thời tiết động, 3D Corner Notification Popup tự động cuộn chữ và Custom Cute Icons.
           */
          @Composable
          fun OledHardwareModuleSimulator(
              state: Esp32StudioState,
              showVoltageInsteadOfPercent: Boolean,
              modifier: Modifier = Modifier
          ) {
              var frameTimeMs by remember { mutableLongStateOf(System.currentTimeMillis()) }
          
              LaunchedEffect(Unit) {
                  while (true) {
                      withInfiniteAnimationFrameMillis {
                          frameTimeMs = System.currentTimeMillis()
                      }
                  }
              }
          
              // Tự động kiểm tra hết hạn Popup hoặc Custom Display tạm thời
              val activePopup = state.activePopup?.takeIf {
                  (frameTimeMs - it.startTimeMs) < it.durationMs
              }
              val activeCustom = state.activeCustomDisplay?.takeIf {
                  it.pinned || (frameTimeMs - it.startTimeMs) < it.durationMs
              }
          
              // Vỏ bo mạch PCB xanh đen của module OLED 0.96 inch I2C
              Column(
                  modifier = modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(18.dp))
                      .background(Color(0xFF0B192C))
                      .border(1.5.dp, Color(0xFF1E3E62), RoundedCornerShape(18.dp))
                      .padding(horizontal = 14.dp, vertical = 10.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  // Hàng chân cắm I2C: GND - VCC - SCL (GPIO 22) - SDA (GPIO 21)
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          text = "SSD1306 0.96\" I2C (0x3C)",
                          color = Color(0xFF94A3B8),
                          fontSize = 10.sp,
                          fontFamily = FontFamily.Monospace,
                          fontWeight = FontWeight.SemiBold
                      )
                      Row(
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          listOf("GND", "3V3", "SCL:22", "SDA:21").forEach { pinLabel ->
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(3.dp)
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .size(7.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFFD97706))
                                          .border(1.dp, Color(0xFFFDE68A), CircleShape)
                                  )
                                  Text(
                                      text = pinLabel,
                                      color = Color(0xFFCBD5E1),
                                      fontSize = 9.sp,
                                      fontFamily = FontFamily.Monospace
                                  )
                              }
                          }
                      }
                  }
          
                  Spacer(modifier = Modifier.height(8.dp))
          
                  // Khung kính đen OLED tỷ lệ chuẩn 2:1 (128x64 pixel)
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .aspectRatio(2.0f)
                          .clip(RoundedCornerShape(8.dp))
                          .background(Color(0xFF04070B))
                          .border(1.5.dp, Color(0xFF1E293B), RoundedCornerShape(8.dp))
                          .padding(4.dp)
                  ) {
                      Canvas(modifier = Modifier.fillMaxSize()) {
                          val scaleX = size.width / 128f
                          val scaleY = size.height / 64f
          
                          val topBarColor = when (state.oledColorMode) {
                              OledColorMode.YELLOW_BLUE -> Color(0xFFFFD600)
                              OledColorMode.ICE_BLUE -> Color(0xFF00E5FF)
                              OledColorMode.CRISP_WHITE -> Color(0xFFF8FAFC)
                          }
                          val mainBodyColor = when (state.oledColorMode) {
                              OledColorMode.YELLOW_BLUE -> Color(0xFF00E5FF)
                              OledColorMode.ICE_BLUE -> Color(0xFF00E5FF)
                              OledColorMode.CRISP_WHITE -> Color(0xFFF8FAFC)
                          }
          
                          // Lưới pixel OLED cực nhẹ tạo cảm giác phần cứng thật
                          drawSubtleOledGrid(scaleX, scaleY)
          
                          // 1. Vẽ Thanh trạng thái (Status Bar - 12px trên cùng)
                          drawOledStatusBar(
                              scaleX = scaleX,
                              scaleY = scaleY,
                              color = topBarColor,
                              isSoftAp = state.isSoftApMode,
                              isBleConnected = state.isBleConnected,
                              batteryPercent = state.batteryPercent,
                              batteryVoltage = state.batteryVoltage,
                              showVoltage = showVoltageInsteadOfPercent,
                              frameTimeMs = frameTimeMs
                          )
          
                          // Đường kẻ ngang phân tách vùng Vàng (16px đầu) và vùng Xanh (48px dưới)
                          drawLine(
                              color = topBarColor.copy(alpha = 0.35f),
                              start = Offset(0f, 14f * scaleY),
                              end = Offset(size.width, 14f * scaleY),
                              strokeWidth = 1f * scaleY
                          )
          
                          // 2. Nội dung màn hình chính theo Chế độ
                          if (state.isSoftApMode) {
                              drawSoftApPortalScreen(scaleX, scaleY, mainBodyColor, frameTimeMs)
                          } else if (activeCustom != null) {
                              drawCustomMessageAndCuteIconScreen(
                                  scaleX = scaleX,
                                  scaleY = scaleY,
                                  color = mainBodyColor,
                                  custom = activeCustom,
                                  frameTimeMs = frameTimeMs
                              )
                          } else {
                              drawHomeClockAndWeatherScreen(
                                  scaleX = scaleX,
                                  scaleY = scaleY,
                                  color = mainBodyColor,
                                  weather = state.weatherCondition,
                                  tempC = state.temperatureC,
                                  frameTimeMs = frameTimeMs
                              )
                          }
          
                          // 3. Hiệu ứng 3D Corner Notification Popup (Dynamic Island / iOS Banner)
                          if (activePopup != null) {
                              draw3dCornerNotificationPopup(
                                  scaleX = scaleX,
                                  scaleY = scaleY,
                                  accentColor = mainBodyColor,
                                  topHighlightColor = topBarColor,
                                  popup = activePopup,
                                  frameTimeMs = frameTimeMs
                              )
                          }
                      }
                  }
          
                  Spacer(modifier = Modifier.height(6.dp))
          
                  // Dòng thông tin trạng thái chân thực bên dưới màn hình
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          text = if (state.isSoftApMode) {
                              "CHẾ ĐỘ: AP CẤU HÌNH (192.168.4.1)"
                          } else if (activePopup != null) {
                              "CHẾ ĐỘ: 3D POPUP (${activePopup.appName.uppercase()})"
                          } else if (activeCustom != null) {
                              "CHẾ ĐỘ: CHỮ & ICON (${activeCustom.icon.labelVi.uppercase()})"
                          } else {
                              "CHẾ ĐỘ: MÀN HÌNH CHÍNH (30 FPS)"
                          },
                          color = Color(0xFF38BDF8),
                          fontSize = 10.sp,
                          fontFamily = FontFamily.Monospace,
                          fontWeight = FontWeight.Medium
                      )
                      Text(
                          text = "Wi-Fi: ${if (state.isSoftApMode) "ESP32-SmartWatch" else state.wifiConnectedSsid}",
                          color = Color(0xFF94A3B8),
                          fontSize = 10.sp,
                          fontFamily = FontFamily.Monospace
                      )
                  }
              }
          }
          
          private fun DrawScope.drawSubtleOledGrid(scaleX: Float, scaleY: Float) {
              val gridColor = Color.White.copy(alpha = 0.025f)
              for (x in 0..128 step 4) {
                  drawLine(
                      color = gridColor,
                      start = Offset(x * scaleX, 0f),
                      end = Offset(x * scaleX, size.height),
                      strokeWidth = 0.5f
                  )
              }
              for (y in 0..64 step 4) {
                  drawLine(
                      color = gridColor,
                      start = Offset(0f, y * scaleY),
                      end = Offset(size.width, y * scaleY),
                      strokeWidth = 0.5f
                  )
              }
          }
          
          private fun DrawScope.drawOledStatusBar(
              scaleX: Float,
              scaleY: Float,
              color: Color,
              isSoftAp: Boolean,
              isBleConnected: Boolean,
              batteryPercent: Int,
              batteryVoltage: Float,
              showVoltage: Boolean,
              frameTimeMs: Long
          ) {
              // Góc trái: Icon Wi-Fi (3 vạch sóng)
              val wifiBaseX = 4f * scaleX
              val wifiBaseY = 11f * scaleY
              for (i in 0..2) {
                  val barH = (3 + i * 3) * scaleY
                  val barX = wifiBaseX + (i * 4f) * scaleX
                  drawRect(
                      color = if (isSoftAp && (frameTimeMs / 400) % 2L == 0L) color.copy(alpha = 0.35f) else color,
                      topLeft = Offset(barX, wifiBaseY - barH),
                      size = Size(2.2f * scaleX, barH)
                  )
              }
          
              // Ký hiệu Bluetooth (BLE) bên cạnh Wi-Fi
              val bleX = 21f * scaleX
              val bleCenterY = 6.5f * scaleY
              val bleAlpha = if (isBleConnected) 1f else 0.75f
              val blePath = Path().apply {
                  moveTo(bleX, bleCenterY - 4.5f * scaleY)
                  lineTo(bleX, bleCenterY + 4.5f * scaleY)
                  lineTo(bleX + 3.2f * scaleX, bleCenterY + 2f * scaleY)
                  lineTo(bleX - 2.5f * scaleX, bleCenterY - 2f * scaleY)
                  moveTo(bleX, bleCenterY - 4.5f * scaleY)
                  lineTo(bleX + 3.2f * scaleX, bleCenterY - 2f * scaleY)
                  lineTo(bleX - 2.5f * scaleX, bleCenterY + 2f * scaleY)
              }
              drawPath(
                  path = blePath,
                  color = color.copy(alpha = bleAlpha),
                  style = Stroke(width = 1.2f * scaleX)
              )
          
              // Chữ trạng thái nhỏ ở giữa thanh Status
              drawOledText(
                  text = if (isSoftAp) "AP:192.168.4.1" else "BLE READY",
                  x = 30f * scaleX,
                  y = 9.8f * scaleY,
                  textSizePx = 7.2f * scaleY,
                  color = color,
                  bold = true
              )
          
              // Góc phải: Text % Pin hoặc Điện áp V + Biểu tượng viên pin
              val batteryText = if (showVoltage) {
                  String.format(Locale.US, "%.2fV", batteryVoltage)
              } else {
                  "$batteryPercent%"
              }
              drawOledText(
                  text = batteryText,
                  x = (if (showVoltage) 84f else 90f) * scaleX,
                  y = 9.8f * scaleY,
                  textSizePx = 7.5f * scaleY,
                  color = color,
                  bold = true
              )
          
              // Viên pin ở toạ độ x = 112..124, y = 3..10
              val batX = 112f * scaleX
              val batY = 3f * scaleY
              val batW = 12f * scaleX
              val batH = 7f * scaleY
              drawRect(
                  color = color,
                  topLeft = Offset(batX, batY),
                  size = Size(batW, batH),
                  style = Stroke(width = 1.1f * scaleX)
              )
              // Đầu cực dương viên pin
              drawRect(
                  color = color,
                  topLeft = Offset(batX + batW, batY + 2f * scaleY),
                  size = Size(1.6f * scaleX, 3f * scaleY)
              )
              // Mức dung lượng bên trong
              val fillW = ((batW - 3f * scaleX) * (batteryPercent / 100f)).coerceAtLeast(1f)
              drawRect(
                  color = color,
                  topLeft = Offset(batX + 1.5f * scaleX, batY + 1.5f * scaleY),
                  size = Size(fillW, batH - 3f * scaleY)
              )
          }
          
          private fun DrawScope.drawHomeClockAndWeatherScreen(
              scaleX: Float,
              scaleY: Float,
              color: Color,
              weather: WeatherCondition,
              tempC: Int,
              frameTimeMs: Long
          ) {
              val now = Date(frameTimeMs)
              val hmFormat = SimpleDateFormat("HH:mm", Locale.getDefault())
              val secFormat = SimpleDateFormat("ss", Locale.getDefault())
              val dateFormat = SimpleDateFormat("dd/MM/yyyy", Locale.getDefault())
              val cal = Calendar.getInstance().apply { time = now }
              val dayOfWeekStr = when (cal.get(Calendar.DAY_OF_WEEK)) {
                  Calendar.MONDAY -> "Thứ 2"
                  Calendar.TUESDAY -> "Thứ 3"
                  Calendar.WEDNESDAY -> "Thứ 4"
                  Calendar.THURSDAY -> "Thứ 5"
                  Calendar.FRIDAY -> "Thứ 6"
                  Calendar.SATURDAY -> "Thứ 7"
                  else -> "Chủ Nhật"
              }
          
              // Khu vực bên trái (0..80px): Đồng hồ số cỡ lớn + Giây + Ngày tháng
              drawOledText(
                  text = hmFormat.format(now),
                  x = 3f * scaleX,
                  y = 39f * scaleY,
                  textSizePx = 22f * scaleY,
                  color = color,
                  bold = true
              )
              drawOledText(
                  text = ":${secFormat.format(now)}",
                  x = 64f * scaleX,
                  y = 29f * scaleY,
                  textSizePx = 9f * scaleY,
                  color = color,
                  bold = true
              )
          
              // Ngày tháng & Thứ bên dưới đồng hồ
              drawOledText(
                  text = "$dayOfWeekStr, ${dateFormat.format(now)}",
                  x = 4f * scaleX,
                  y = 52f * scaleY,
                  textSizePx = 7.8f * scaleY,
                  color = color,
                  bold = false
              )
          
              // Dòng địa phương + trạng thái thời tiết
              drawOledText(
                  text = weather.labelVi,
                  x = 4f * scaleX,
                  y = 61.5f * scaleY,
                  textSizePx = 7.2f * scaleY,
                  color = color.copy(alpha = 0.85f),
                  bold = false
              )
          
              // Đường kẻ dọc chia cột Đồng hồ và Widget Thời tiết
              drawLine(
                  color = color.copy(alpha = 0.3f),
                  start = Offset(84f * scaleX, 17f * scaleY),
                  end = Offset(84f * scaleX, 62f * scaleY),
                  strokeWidth = 1f * scaleX
              )
          
              // Khu vực bên phải (86..127px): Hoạt ảnh Thời tiết (Mặt trời xoay / Đám mây trôi / Mưa rơi) + Nhiệt độ
              val weatherCenterX = 106f * scaleX
              val weatherCenterY = 32f * scaleY
          
              when (weather) {
                  WeatherCondition.SUNNY -> {
                      // Mặt trời với 8 tia sáng xoay tròn theo thời gian thực
                      val radius = 6.5f * scaleX
                      drawCircle(
                          color = color,
                          radius = radius,
                          center = Offset(weatherCenterX, weatherCenterY),
                          style = Stroke(width = 1.6f * scaleX)
                      )
                      val angleOffset = (frameTimeMs % 6000L) / 6000f * (2f * PI.toFloat())
                      for (i in 0 until 8) {
                          val angle = angleOffset + i * (PI.toFloat() / 4f)
                          val innerR = 9f * scaleX
                          val outerR = (12.2f + 1.2f * sin((frameTimeMs / 220.0) + i).toFloat()) * scaleX
                          drawLine(
                              color = color,
                              start = Offset(
                                  weatherCenterX + cos(angle) * innerR,
                                  weatherCenterY + sin(angle) * innerR
                              ),
                              end = Offset(
                                  weatherCenterX + cos(angle) * outerR,
                                  weatherCenterY + sin(angle) * outerR
                              ),
                              strokeWidth = 1.4f * scaleX
                          )
                      }
                  }
          
                  WeatherCondition.CLOUDY -> {
                      // Mặt trời lấp ló + Đám mây trôi qua lại mượt mà
                      val driftX = sin(frameTimeMs / 650.0).toFloat() * 3.5f * scaleX
                      drawCircle(
                          color = color.copy(alpha = 0.75f),
                          radius = 4.5f * scaleX,
                          center = Offset(weatherCenterX - 5f * scaleX - driftX * 0.4f, weatherCenterY - 4f * scaleY),
                          style = Stroke(width = 1.3f * scaleX)
                      )
                      drawAnimatedCloud(
                          centerX = weatherCenterX + driftX,
                          centerY = weatherCenterY + 2f * scaleY,
                          scaleX = scaleX,
                          scaleY = scaleY,
                          color = color
                      )
                  }
          
                  WeatherCondition.RAINY -> {
                      // Đám mây + Các hạt mưa rơi liên tục từ mây xuống
                      val driftX = sin(frameTimeMs / 800.0).toFloat() * 2.2f * scaleX
                      drawAnimatedCloud(
                          centerX = weatherCenterX + driftX,
                          centerY = weatherCenterY - 2f * scaleY,
                          scaleX = scaleX,
                          scaleY = scaleY,
                          color = color
                      )
                      for (dropIdx in 0..2) {
                          val progress = ((frameTimeMs / 12L + dropIdx * 33L) % 100L) / 100f
                          val dropX = weatherCenterX - 6f * scaleX + dropIdx * 6f * scaleX + driftX * 0.5f
                          val dropY = (weatherCenterY + 4f * scaleY) + progress * (8.5f * scaleY)
                          drawLine(
                              color = color,
                              start = Offset(dropX, dropY),
                              end = Offset(dropX - 1.5f * scaleX, dropY + 3f * scaleY),
                              strokeWidth = 1.3f * scaleX
                          )
                      }
                  }
              }
          
              // Nhiệt độ địa phương bên dưới icon thời tiết
              drawOledText(
                  text = "${tempC}°C",
                  x = 93f * scaleX,
                  y = 58.5f * scaleY,
                  textSizePx = 10.5f * scaleY,
                  color = color,
                  bold = true
              )
          }
          
          private fun DrawScope.drawAnimatedCloud(
              centerX: Float,
              centerY: Float,
              scaleX: Float,
              scaleY: Float,
              color: Color
          ) {
              drawCircle(
                  color = color,
                  radius = 4.8f * scaleX,
                  center = Offset(centerX - 4.5f * scaleX, centerY + 1f * scaleY)
              )
              drawCircle(
                  color = color,
                  radius = 6.2f * scaleX,
                  center = Offset(centerX + 0.5f * scaleX, centerY - 1.5f * scaleY)
              )
              drawCircle(
                  color = color,
                  radius = 4.5f * scaleX,
                  center = Offset(centerX + 5.5f * scaleX, centerY + 1.2f * scaleY)
              )
              drawRoundRect(
                  color = color,
                  topLeft = Offset(centerX - 8.5f * scaleX, centerY + 1f * scaleY),
                  size = Size(18f * scaleX, 4.8f * scaleY),
                  cornerRadius = CornerRadius(2f * scaleX, 2f * scaleY)
              )
          }
          
          /**
           * Hiệu ứng 3D Corner Notification Popup (bung ra từ góc trên màn hình kiểu iOS / Dynamic Island,
           * có viền đổ bóng 3D, hiện logo Zalo/Messenger, tên người gửi và tự động cuộn dọc nếu tin nhắn dài).
           */
          private fun DrawScope.draw3dCornerNotificationPopup(
              scaleX: Float,
              scaleY: Float,
              accentColor: Color,
              topHighlightColor: Color,
              popup: NotificationPopupState,
              frameTimeMs: Long
          ) {
              val elapsed = (frameTimeMs - popup.startTimeMs).coerceAtLeast(0L)
              val expandMs = 420f
              val collapseMs = 380f
              val remaining = (popup.durationMs - elapsed).coerceAtLeast(0L)
          
              // Tính hệ số phóng to / thu nhỏ từ góc (0.0 -> 1.0)
              val rawProgress = when {
                  elapsed < expandMs -> (elapsed / expandMs).coerceIn(0f, 1f)
                  remaining < collapseMs -> (remaining / collapseMs).coerceIn(0f, 1f)
                  else -> 1f
              }
              // Ease-out cubic mượt mà
              val eased = 1f - (1f - rawProgress) * (1f - rawProgress) * (1f - rawProgress)
          
              // Bung từ góc trên trái (x=2, y=2, w=12, h=8) ra toàn khung (x=2, y=10, w=122, h=51)
              val boxX = (2f + (1f - eased) * 1f) * scaleX
              val boxY = (2f + eased * 8f) * scaleY
              val boxW = (14f + eased * 108f) * scaleX
              val boxH = (8f + eased * 43f) * scaleY
              val cornerR = CornerRadius(5f * scaleX, 5f * scaleY)
          
              // Lớp nền xóa màn hình phía dưới để tạo chiều sâu
              drawRoundRect(
                  color = Color(0xFF04070B),
                  topLeft = Offset(boxX - 1f * scaleX, boxY - 1f * scaleY),
                  size = Size(boxW + 4f * scaleX, boxH + 4f * scaleY),
                  cornerRadius = cornerR
              )
          
              // Hiệu ứng đổ bóng 3D ở cạnh phải và cạnh dưới
              drawRoundRect(
                  color = accentColor.copy(alpha = 0.65f),
                  topLeft = Offset(boxX + 2.4f * scaleX, boxY + 2.4f * scaleY),
                  size = Size(boxW, boxH),
                  cornerRadius = cornerR,
                  style = Stroke(width = 1.6f * scaleX)
              )
          
              // Khung chính của 3D Popup
              drawRoundRect(
                  color = Color(0xFF050A10),
                  topLeft = Offset(boxX, boxY),
                  size = Size(boxW, boxH),
                  cornerRadius = cornerR
              )
              drawRoundRect(
                  color = accentColor,
                  topLeft = Offset(boxX, boxY),
                  size = Size(boxW, boxH),
                  cornerRadius = cornerR,
                  style = Stroke(width = 1.5f * scaleX)
              )
          
              // Chỉ vẽ nội dung chữ bên trong khi khung đang bung quá 55%
              if (eased > 0.55f) {
                  clipRect(
                      left = boxX + 2f * scaleX,
                      top = boxY + 2f * scaleY,
                      right = boxX + boxW - 2f * scaleX,
                      bottom = boxY + boxH - 2f * scaleY
                  ) {
                      // Thanh Header đảo màu (hiển thị Logo App + Tên App + Người gửi)
                      val headerH = 14f * scaleY
                      drawRoundRect(
                          color = topHighlightColor,
                          topLeft = Offset(boxX + 2f * scaleX, boxY + 2f * scaleY),
                          size = Size(boxW - 4f * scaleX, headerH),
                          cornerRadius = CornerRadius(3f * scaleX, 3f * scaleY)
                      )
          
                      // Logo App (11x11px góc trái)
                      val logoX = boxX + 4.5f * scaleX
                      val logoY = boxY + 3.5f * scaleY
                      val logoSize = 11f * scaleY
                      drawRoundRect(
                          color = Color(0xFF04070B),
                          topLeft = Offset(logoX, logoY),
                          size = Size(logoSize, logoSize),
                          cornerRadius = CornerRadius(2.5f * scaleX, 2.5f * scaleY)
                      )
                      val appInitial = popup.appName.firstOrNull()?.uppercaseChar()?.toString() ?: "N"
                      drawOledText(
                          text = appInitial,
                          x = logoX + 2.4f * scaleX,
                          y = logoY + 8.8f * scaleY,
                          textSizePx = 8f * scaleY,
                          color = topHighlightColor,
                          bold = true
                      )
          
                      // Tiêu đề: [App] Tên người gửi
                      val headerTitle = "${popup.appName}: ${popup.sender}".take(21)
                      drawOledText(
                          text = headerTitle,
                          x = logoX + logoSize + 3.5f * scaleX,
                          y = boxY + 11.8f * scaleY,
                          textSizePx = 8f * scaleY,
                          color = Color(0xFF04070B),
                          bold = true
                      )
          
                      // Vùng nội dung tin nhắn bên dưới Header (tự động xuống dòng & cuộn dọc mượt mà)
                      val msgAreaTop = boxY + headerH + 4f * scaleY
                      val msgAreaBottom = boxY + boxH - 3f * scaleY
                      val lineHeight = 10.5f * scaleY
                      val lines = wrapTextIntoOledLines(popup.message, maxCharsPerLine = 22)
          
                      val totalTextHeight = lines.size * lineHeight
                      val visibleHeight = msgAreaBottom - msgAreaTop
                      val maxScrollPx = (totalTextHeight - visibleHeight + 4f * scaleY).coerceAtLeast(0f)
          
                      // Đứng yên 1.5s đầu để người dùng đọc dòng đầu, sau đó cuộn dọc từ từ xuống dưới
                      val scrollOffsetPx = if (elapsed < 1500L || maxScrollPx <= 0f) {
                          0f
                      } else {
                          val scrollDuration = (popup.durationMs - 2400L).coerceAtLeast(1500L)
                          val scrollProgress = ((elapsed - 1500L).toFloat() / scrollDuration).coerceIn(0f, 1f)
                          scrollProgress * maxScrollPx
                      }
          
                      clipRect(
                          left = boxX + 4f * scaleX,
                          top = msgAreaTop,
                          right = boxX + boxW - 4f * scaleX,
                          bottom = msgAreaBottom
                      ) {
                          lines.forEachIndexed { idx, line ->
                              val lineY = msgAreaTop + (idx + 1) * lineHeight - scrollOffsetPx - 1.5f * scaleY
                              drawOledText(
                                  text = line,
                                  x = boxX + 5f * scaleX,
                                  y = lineY,
                                  textSizePx = 8.2f * scaleY,
                                  color = accentColor,
                                  bold = false
                              )
                          }
                      }
                  }
              }
          }
          
          /**
           * Chế độ hiển thị Chữ tùy chỉnh (tên người đặc biệt / lời nhắn) kèm Icon dễ thương hoạt họa.
