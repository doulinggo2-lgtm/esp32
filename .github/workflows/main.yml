          private fun DrawScope.drawCustomMessageAndCuteIconScreen(
              scaleX: Float,
              scaleY: Float,
              color: Color,
              custom: CustomDisplayState,
              frameTimeMs: Long
          ) {
              // Khung viền trang trí nhẹ
              drawRoundRect(
                  color = color.copy(alpha = 0.45f),
                  topLeft = Offset(2f * scaleX, 16f * scaleY),
                  size = Size(124f * scaleX, 46f * scaleY),
                  cornerRadius = CornerRadius(4f * scaleX, 4f * scaleY),
                  style = Stroke(width = 1f * scaleX)
              )
          
              // Vẽ Icon hoạt họa dễ thương ở bên trái (x = 22, y = 39)
              val iconCenterX = 22f * scaleX
              val iconCenterY = 39f * scaleY
              val pulse = 1f + 0.14f * sin(frameTimeMs / 180.0).toFloat()
          
              when (custom.icon) {
                  CuteIconType.HEART -> {
                      drawPixelHeart(iconCenterX, iconCenterY, 10f * scaleX * pulse, color)
                  }
                  CuteIconType.LOVE -> {
                      drawPixelHeart(iconCenterX - 3f * scaleX, iconCenterY + 2f * scaleY, 8.5f * scaleX * pulse, color)
                      val floatY = sin(frameTimeMs / 240.0).toFloat() * 3f * scaleY
                      drawPixelHeart(iconCenterX + 7f * scaleX, iconCenterY - 6f * scaleY + floatY, 5.2f * scaleX, color)
                  }
                  CuteIconType.SMILE -> {
                      drawCircle(
                          color = color,
                          radius = 11f * scaleX,
                          center = Offset(iconCenterX, iconCenterY),
                          style = Stroke(width = 1.6f * scaleX)
                      )
                      // Mắt cười cong
                      drawLine(
                          color = color,
                          start = Offset(iconCenterX - 5f * scaleX, iconCenterY - 2f * scaleY),
                          end = Offset(iconCenterX - 2f * scaleX, iconCenterY - 4f * scaleY),
                          strokeWidth = 1.5f * scaleX
                      )
                      drawLine(
                          color = color,
                          start = Offset(iconCenterX + 2f * scaleX, iconCenterY - 4f * scaleY),
                          end = Offset(iconCenterX + 5f * scaleX, iconCenterY - 2f * scaleY),
                          strokeWidth = 1.5f * scaleX
                      )
                      // Miệng cười
                      drawLine(
                          color = color,
                          start = Offset(iconCenterX - 5f * scaleX, iconCenterY + 3f * scaleY),
                          end = Offset(iconCenterX, iconCenterY + 6f * scaleY),
                          strokeWidth = 1.5f * scaleX
                      )
                      drawLine(
                          color = color,
                          start = Offset(iconCenterX, iconCenterY + 6f * scaleY),
                          end = Offset(iconCenterX + 5f * scaleX, iconCenterY + 3f * scaleY),
                          strokeWidth = 1.5f * scaleX
                      )
                  }
                  CuteIconType.CRY -> {
                      drawCircle(
                          color = color,
                          radius = 11f * scaleX,
                          center = Offset(iconCenterX, iconCenterY),
                          style = Stroke(width = 1.6f * scaleX)
                      )
                      // Mắt
                      drawCircle(color = color, radius = 1.5f * scaleX, center = Offset(iconCenterX - 4f * scaleX, iconCenterY - 3f * scaleY))
                      drawCircle(color = color, radius = 1.5f * scaleX, center = Offset(iconCenterX + 4f * scaleX, iconCenterY - 3f * scaleY))
                      // Giọt nước mắt rơi động
                      val tearOffset = ((frameTimeMs / 15L) % 60L) / 60f * 6f * scaleY
                      drawLine(
                          color = color,
                          start = Offset(iconCenterX - 4f * scaleX, iconCenterY + tearOffset),
                          end = Offset(iconCenterX - 4f * scaleX, iconCenterY + 3f * scaleY + tearOffset),
                          strokeWidth = 1.4f * scaleX
                      )
                      drawLine(
                          color = color,
                          start = Offset(iconCenterX + 4f * scaleX, iconCenterY + tearOffset),
                          end = Offset(iconCenterX + 4f * scaleX, iconCenterY + 3f * scaleY + tearOffset),
                          strokeWidth = 1.4f * scaleX
                      )
                      // Miệng mếu
                      drawLine(
                          color = color,
                          start = Offset(iconCenterX - 4f * scaleX, iconCenterY + 6f * scaleY),
                          end = Offset(iconCenterX, iconCenterY + 4f * scaleY),
                          strokeWidth = 1.5f * scaleX
                      )
                      drawLine(
                          color = color,
                          start = Offset(iconCenterX, iconCenterY + 4f * scaleY),
                          end = Offset(iconCenterX + 4f * scaleX, iconCenterY + 6f * scaleY),
                          strokeWidth = 1.5f * scaleX
                      )
                  }
                  CuteIconType.STAR -> {
                      val rOuter = 11f * scaleX * pulse
                      val rInner = 4.8f * scaleX * pulse
                      val starPath = Path()
                      for (i in 0 until 10) {
                          val r = if (i % 2 == 0) rOuter else rInner
                          val angle = -PI.toFloat() / 2f + i * (PI.toFloat() / 5f)
                          val px = iconCenterX + cos(angle) * r
                          val py = iconCenterY + sin(angle) * r
                          if (i == 0) starPath.moveTo(px, py) else starPath.lineTo(px, py)
                      }
                      starPath.close()
                      drawPath(starPath, color = color, style = Stroke(width = 1.5f * scaleX))
                  }
              }
          
              // Vẽ chữ tùy chỉnh ở bên phải icon (x = 40..122)
              val lines = wrapTextIntoOledLines(custom.text, maxCharsPerLine = 14).take(3)
              val startY = when (lines.size) {
                  1 -> 42f * scaleY
                  2 -> 35f * scaleY
                  else -> 29f * scaleY
              }
              lines.forEachIndexed { idx, line ->
                  drawOledText(
                      text = line,
                      x = 40f * scaleX,
                      y = startY + idx * 12f * scaleY,
                      textSizePx = if (lines.size == 1) 11f * scaleY else 9.2f * scaleY,
                      color = color,
                      bold = true
                  )
              }
          }
          
          private fun DrawScope.drawPixelHeart(cx: Float, cy: Float, size: Float, color: Color) {
              val path = Path().apply {
                  moveTo(cx, cy + size * 0.75f)
                  cubicTo(
                      cx - size * 1.2f, cy + size * 0.1f,
                      cx - size * 0.9f, cy - size * 0.85f,
                      cx, cy - size * 0.25f
                  )
                  cubicTo(
                      cx + size * 0.9f, cy - size * 0.85f,
                      cx + size * 1.2f, cy + size * 0.1f,
                      cx, cy + size * 0.75f
                  )
                  close()
              }
              drawPath(path = path, color = color)
          }
          
