          enum class WeatherCondition(val labelVi: String, val tempDefault: Int) {
              SUNNY("Trời nắng", 31),
              CLOUDY("Nhiều mây", 27),
              RAINY("Mưa rào", 24)
          }
          
          enum class CuteIconType(val id: String, val labelVi: String, val emoji: String) {
              HEART("heart", "Trái tim", "❤️"),
              LOVE("love", "Yêu thương", "🥰"),
              SMILE("smile", "Cười tươi", "😊"),
              CRY("cry", "Khóc nhè", "😭"),
              STAR("star", "Lấp lánh", "✨")
          }
          
          enum class OledColorMode(val labelVi: String) {
              YELLOW_BLUE("Vàng - Xanh (Dual OLED)"),
              ICE_BLUE("Xanh Băng (Ice Cyan)"),
              CRISP_WHITE("Trắng Sáng (Pure White)")
          }
          
          data class NotificationPopupState(
              val id: Long = System.currentTimeMillis(),
              val appName: String,
              val sender: String,
              val message: String,
              val startTimeMs: Long = System.currentTimeMillis(),
              val durationMs: Long = 9500L
          )
          
          data class CustomDisplayState(
              val text: String,
              val icon: CuteIconType,
              val pinned: Boolean,
              val startTimeMs: Long = System.currentTimeMillis(),
              val durationMs: Long = 12000L
          )
          
          data class NotificationLogItem(
              val id: Long = System.currentTimeMillis(),
              val time: String,
              val appName: String,
              val sender: String,
              val message: String,
              val rawJson: String,
              val sentViaBle: Boolean
          )
          
          data class ScannedWifiNetwork(
              val ssid: String,
              val rssi: Int,
