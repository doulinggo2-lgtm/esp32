              fun connectEsp32ToHomeWifi(ssid: String, password: String) {
                  if (ssid.isBlank()) return
                  _state.value = _state.value.copy(
                      wifiConnectedSsid = ssid.trim(),
                      isSoftApMode = false,
                      portalStatusMessage = "Đã lưu Wi-Fi \"$ssid\" vào Preferences Flash! ESP32 đã đồng bộ giờ NTP, Thời tiết & bật Bluetooth BLE."
