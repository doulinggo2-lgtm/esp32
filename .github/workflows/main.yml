          private fun DrawScope.drawOledText(
              text: String,
              x: Float,
              y: Float,
              textSizePx: Float,
              color: Color,
              bold: Boolean
          ) {
              drawContext.canvas.nativeCanvas.apply {
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      this.color = color.toArgb()
                      this.textSize = textSizePx
                      this.typeface = Typeface.create(
                          Typeface.MONOSPACE,
                          if (bold) Typeface.BOLD else Typeface.NORMAL
                      )
                  }
                  drawText(text, x, y, paint)
              }
          }
          
          private fun wrapTextIntoOledLines(text: String, maxCharsPerLine: Int): List<String> {
              if (text.isBlank()) return listOf("")
              val words = text.trim().split(Regex("\\s+"))
              val lines = mutableListOf<String>()
              var currentLine = StringBuilder()
          
              for (word in words) {
                  if (currentLine.isEmpty()) {
                      if (word.length <= maxCharsPerLine) {
                          currentLine.append(word)
                      } else {
                          word.chunked(maxCharsPerLine).forEachIndexed { idx, chunk ->
                              if (idx < word.chunked(maxCharsPerLine).lastIndex) {
                                  lines.add(chunk)
                              } else {
                                  currentLine.append(chunk)
                              }
                          }
                      }
                  } else if (currentLine.length + 1 + word.length <= maxCharsPerLine) {
                      currentLine.append(" ").append(word)
                  } else {
                      lines.add(currentLine.toString())
                      currentLine = StringBuilder(word)
                  }
              }
              if (currentLine.isNotEmpty()) {
                  lines.add(currentLine.toString())
              }
              return lines
          }
