              val ESP32_FULL_ARDUINO_CODE: String = """
          /*
           * ======================================================================================
           * DỰ ÁN: ĐỒNG HỒ THÔNG MINH ESP32 + OLED 0.96" I2C (SSD1306 128x64)
           * TÍNH NĂNG:
           *   1. Khởi động phát Wi-Fi "ESP32-SmartWatch" (IP: 192.168.4.1), Web Portal quét mạng
           *      Wi-Fi xung quanh, chọn mạng & lưu vào bộ nhớ Flash (Preferences).
           *   2. Đồng bộ Ngày/Giờ thực qua NTP (GMT+7) & Thời tiết địa phương qua Open-Meteo API.
           *   3. Giao diện GUI 30 FPS mượt mà:
           *      - Status Bar: Wi-Fi, BLE, % Pin & Điện áp (đọc ADC chân GPIO 34).
           *      - Hiệu ứng Thời tiết động: Mặt trời xoay tia sáng, Mây trôi, Mưa rơi.
           *      - Hiệu ứng Thông báo "3D Corner Popup" kiểu iOS: Bung mượt từ góc trên (ease-out),
           *        hiển thị Logo Zalo/Messenger/SMS, Tên người gửi & Tự động cuộn dọc khi tin dài.
           *      - Chế độ Hiển thị Chữ tùy chỉnh (tên người thương/lời nhắn) & Icon dễ thương đập nhịp.
           *   4. Nhận dữ liệu JSON thời gian thực qua Bluetooth BLE (NimBLE-Arduino) từ App Android.
           *
           * CÀI ĐẶT THƯ VIỆN TRONG ARDUINO IDE:
           *   - Adafruit SSD1306 (by Adafruit)
           *   - Adafruit GFX Library (by Adafruit)
           *   - ArduinoJson (by Benoit Blanchon)
           *   - NimBLE-Arduino (by h2zero) -> Nhẹ RAM gấp 3 lần BLE gốc khi chạy chung với Wi-Fi!
           *
           * LƯU Ý CHỌN PARTITION SCHEME:
           *   Tools -> Partition Scheme -> "Huge APP (3MB No OTA/1MB SPIFFS)"
           * ======================================================================================
           */
          
          #include <Wire.h>
          #include <WiFi.h>
          #include <WebServer.h>
          #include <Preferences.h>
          #include <HTTPClient.h>
          #include <time.h>
          #include <math.h>
          #include <Adafruit_GFX.h>
          #include <Adafruit_SSD1306.h>
          #include <ArduinoJson.h>
          #include <NimBLEDevice.h>
          
          // --------------------- CẤU HÌNH PHẦN CỨNG MÀN HÌNH & PIN ---------------------
          #define SCREEN_WIDTH 128
          #define SCREEN_HEIGHT 64
          #define OLED_RESET    -1
          #define OLED_I2C_ADDR 0x3C
          #define I2C_SDA_PIN   21
          #define I2C_SCL_PIN   22
          #define BAT_ADC_PIN   34   // Cầu phân áp 2 điện trở 100kOhm nối vào GPIO 34
          
          Adafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, OLED_I2C_ADDR);
          Preferences preferences;
          WebServer server(80);
          
          // --------------------- CẤU HÌNH BLUETOOTH BLE UUID ---------------------
          #define BLE_DEVICE_NAME "ESP32-SmartWatch-BLE"
          #define SERVICE_UUID    "4fafc201-1fb5-459e-8fcc-c5c9c331914b"
          #define CHAR_UUID       "beb5483e-36e1-4688-b7f5-ea07361b26a8"
          
          // --------------------- CẤU HÌNH THỜI GIAN NTP & THỜI TIẾT ---------------------
          const char* ntpServer = "pool.ntp.org";
          const long  gmtOffset_sec = 7 * 3600; // GMT+7 Việt Nam
          const int   daylightOffset_sec = 0;
          
          // Tọa độ mặc định (Hà Nội: 21.0285, 105.8542 | TP.HCM: 10.8231, 106.6297)
          String weatherApiUrl = "http://api.open-meteo.com/v1/forecast?latitude=21.0285&longitude=105.8542&current_weather=true";
          
          // --------------------- BIẾN TRẠNG THÁI HỆ THỐNG ---------------------
          bool isApConfigMode = false;
          bool isBleClientConnected = false;
          float currentTempC = 29.0;
          int weatherCode = 0; // 0: Nắng, 1..3: Mây, >=50: Mưa
          int batteryPercent = 86;
          float batteryVoltage = 4.02;
          
          unsigned long lastFrameMs = 0;
          unsigned long lastWeatherUpdateMs = 0;
          unsigned long lastBatteryReadMs = 0;
          
          // --------------------- TRẠNG THÁI 3D CORNER POPUP & CUSTOM DISPLAY ---------------------
          struct NotificationPopup {
            bool active = false;
            String app = "";
            String sender = "";
            String msg = "";
            unsigned long startMs = 0;
            unsigned long durationMs = 8000;
          } popup;
          
          struct CustomScreen {
            bool active = false;
            String text = "";
            String icon = "heart"; // heart, love, smile, cry, star
            bool pinned = false;
            unsigned long startMs = 0;
            unsigned long durationMs = 15000;
          } customView;
          
          // --------------------- BITMAP ICON 12x12 & 16x16 (PROGMEM) ---------------------
          // Icon Trái tim 16x16
          const unsigned char PROGMEM bmp_heart_16x16[] = {
            0x00, 0x00, 0x1c, 0x38, 0x3e, 0x7c, 0x7f, 0xfe, 0x7f, 0xfe, 0x7f, 0xfe, 0x3f, 0xfc, 0x1f, 0xf8,
            0x0f, 0xf0, 0x07, 0xe0, 0x03, 0xc0, 0x01, 0x80, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00
          };
          
          // --------------------- ĐỌC ĐIỆN ÁP & PHẦN TRĂM PIN ---------------------
          void updateBatteryStatus() {
            if (millis() - lastBatteryReadMs < 5000 && lastBatteryReadMs != 0) return;
            lastBatteryReadMs = millis();
          
            uint32_t raw = analogRead(BAT_ADC_PIN);
            if (raw > 100) {
              // Cầu phân áp 1:1 (100k - 100k), chuẩn ADC 3.3V / 4095
              batteryVoltage = (raw / 4095.0f) * 3.3f * 2.0f * 1.06f;
              int pct = (int)((batteryVoltage - 3.30f) / (4.20f - 3.30f) * 100.0f);
              batteryPercent = constrain(pct, 0, 100);
            }
          }
          
          // --------------------- ĐỒNG BỘ THỜI TIẾT TỪ OPEN-METEO API ---------------------
          void fetchLocalWeather() {
            if (WiFi.status() != WL_CONNECTED) return;
            HTTPClient http;
            http.begin(weatherApiUrl);
            int httpCode = http.GET();
            if (httpCode == HTTP_CODE_OK) {
              String payload = http.getString();
              JsonDocument doc;
              if (!deserializeJson(doc, payload)) {
                currentTempC = doc["current_weather"]["temperature"] | 29.0f;
                weatherCode  = doc["current_weather"]["weathercode"] | 0;
              }
            }
            http.end();
          }
          
          // --------------------- XỬ LÝ NHẬN GÓI TIN JSON TỪ APP ANDROID QUA BLE ---------------------
          class SmartWatchBleCallbacks : public NimBLEServerCallbacks {
            void onConnect(NimBLEServer* pServer) {
              isBleClientConnected = true;
            }
            void onDisconnect(NimBLEServer* pServer) {
              isBleClientConnected = false;
              NimBLEDevice::startAdvertising(); // Tự động phát lại BLE khi điện thoại ngắt kết nối
            }
          };
          
          class SmartWatchCharCallbacks : public NimBLECharacteristicCallbacks {
            void onWrite(NimBLECharacteristic* pCharacteristic) {
              std::string val = pCharacteristic->getValue();
              if (val.empty()) return;
          
              JsonDocument doc;
              DeserializationError err = deserializeJson(doc, val.c_str());
              if (err) return;
          
              String type = doc["type"] | "";
              if (type == "notif") {
                popup.app = doc["app"] | "App";
                popup.sender = doc["sender"] | "Tin nhan";
                popup.msg = doc["msg"] | "";
                popup.startMs = millis();
                int extraTime = max(0, (int)popup.msg.length() - 25) * 70;
                popup.durationMs = 6500 + min(extraTime, 9000);
                popup.active = true;
              } else if (type == "custom") {
                customView.text = doc["text"] | "Hello!";
                customView.icon = doc["icon"] | "heart";
                customView.pinned = doc["pinned"] | false;
                int durSec = doc["duration"] | 15;
                customView.durationMs = (unsigned long)durSec * 1000UL;
                customView.startMs = millis();
                customView.active = true;
                popup.active = false;
              } else if (type == "home") {
                customView.active = false;
                popup.active = false;
              }
            }
          };
          
          void initBleServer() {
            NimBLEDevice::init(BLE_DEVICE_NAME);
            NimBLEDevice::setMTU(512);
            NimBLEServer* pServer = NimBLEDevice::createServer();
            pServer->setCallbacks(new SmartWatchBleCallbacks());
          
            NimBLEService* pService = pServer->createService(SERVICE_UUID);
            NimBLECharacteristic* pChar = pService->createCharacteristic(
              CHAR_UUID,
              NIMBLE_PROPERTY::WRITE | NIMBLE_PROPERTY::WRITE_NR
            );
            pChar->setCallbacks(new SmartWatchCharCallbacks());
          
            pService->start();
            NimBLEAdvertising* pAdvertising = NimBLEDevice::getAdvertising();
            pAdvertising->addServiceUUID(SERVICE_UUID);
            pAdvertising->setScanResponse(true);
            pAdvertising->start();
          }
          
          // --------------------- TRANG WEB CẤU HÌNH WI-FI TẠI 192.168.4.1 ---------------------
          void handleRootPortal() {
            int n = WiFi.scanNetworks();
            String html = "<!DOCTYPE html><html><head><meta charset='utf-8'>";
            html += "<meta name='viewport' content='width=device-width,initial-scale=1'>";
            html += "<title>Cấu Hình Wi-Fi ESP32 Smartwatch</title>";
            html += "<style>";
            html += "body{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:18px;margin:0;}";
            html += ".card{max-width:400px;margin:0 auto;background:#1e293b;padding:20px;border-radius:14px;border:1px solid #334155;}";
            html += "h2{margin-top:0;color:#38bdf8;font-size:20px;}";
            html += ".net{padding:10px 12px;margin:6px 0;background:#0f172a;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;border:1px solid #334155;}";
            html += ".net:hover{border-color:#38bdf8;}";
            html += "input{width:100%;padding:11px;margin:8px 0 14px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;box-sizing:border-box;}";
            html += "button{width:100%;padding:12px;background:#0284c7;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;}";
            html += "</style>";
            html += "<script>function pick(s){document.getElementById('ssid').value=s;document.getElementById('pass').focus();}</script>";
            html += "</head><body><div class='card'>";
            html += "<h2>ESP32 Smartwatch Wi-Fi</h2>";
            html += "<p style='color:#94a3b8;font-size:13px;'>Chạm vào mạng Wi-Fi bên dưới và nhập mật khẩu:</p>";
          
            for (int i = 0; i < n; ++i) {
              String ssid = WiFi.SSID(i);
              int rssi = WiFi.RSSI(i);
              html += "<div class='net' onclick=\"pick('" + ssid + "')\">";
              html += "<span><b>" + ssid + "</b></span><span style='color:#38bdf8'>" + String(rssi) + " dBm</span></div>";
            }
          
            html += "<form method='POST' action='/save'>";
            html += "<label>Tên Wi-Fi (SSID):</label><input id='ssid' name='ssid' placeholder='Chọn hoặc nhập tên Wi-Fi' required>";
            html += "<label>Mật khẩu Wi-Fi:</label><input id='pass' name='pass' type='password' placeholder='Nhập mật khẩu Wi-Fi nhà'>";
            html += "<button type='submit'>Lưu & Kết Nối Wi-Fi</button>";
            html += "</form>";
            html += "<p style='text-align:center;margin-top:12px;'><a href='/' style='color:#38bdf8;'>Quét lại mạng Wi-Fi</a></p>";
            html += "</div></body></html>";
            server.send(200, "text/html", html);
          }
          
          void handleSaveWifi() {
            String ssid = server.arg("ssid");
            String pass = server.arg("pass");
            if (ssid.length() > 0) {
              preferences.begin("wifi_cfg", false);
              preferences.putString("ssid", ssid);
              preferences.putString("pass", pass);
              preferences.end();
          
              String okHtml = "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'></head>";
              okHtml += "<body style='background:#0f172a;color:#38bdf8;font-family:sans-serif;text-align:center;padding:40px;'>";
              okHtml += "<h2>Đã lưu Wi-Fi: " + ssid + "!</h2><p>ESP32 đang khởi động lại để kết nối mạng nhà & bật Bluetooth BLE...</p></body></html>";
              server.send(200, "text/html", okHtml);
              delay(1500);
              ESP.restart();
            }
          }
          
          void startSoftApPortal() {
            isApConfigMode = true;
            WiFi.mode(WIFI_AP_STA);
            IPAddress local_IP(192, 168, 4, 1);
            IPAddress gateway(192, 168, 4, 1);
            IPAddress subnet(255, 255, 255, 0);
            WiFi.softAPConfig(local_IP, gateway, subnet);
            WiFi.softAP("ESP32-SmartWatch");
          
            server.on("/", handleRootPortal);
            server.on("/save", HTTP_POST, handleSaveWifi);
            server.begin();
          }
          
          // --------------------- CÁC HÀM VẼ GIAO DIỆN GUI MƯỢT MÀ (30 FPS) ---------------------
          void drawStatusBar() {
            // Icon Wi-Fi góc trái
            for (int i = 0; i < 3; i++) {
              int bh = 3 + i * 3;
              display.fillRect(2 + i * 4, 10 - bh, 2, bh, SSD1306_WHITE);
            }
            // Chữ BLE trạng thái
            display.setTextSize(1);
            display.setTextColor(SSD1306_WHITE);
            display.setCursor(18, 2);
            display.print(isBleClientConnected ? "BLE:OK" : "BLE..");
          
            // Phần trăm Pin & Icon viên pin góc phải
            display.setCursor(82, 2);
            display.print(String(batteryPercent) + "%");
            display.drawRect(112, 2, 12, 7, SSD1306_WHITE);
            display.fillRect(124, 4, 2, 3, SSD1306_WHITE);
            int fillW = map(batteryPercent, 0, 100, 1, 8);
            display.fillRect(114, 4, fillW, 3, SSD1306_WHITE);
          
            display.drawFastHLine(0, 12, 128, SSD1306_WHITE);
          }
          
          void drawAnimatedWeatherWidget(unsigned long nowMs) {
            display.drawFastVLine(84, 14, 50, SSD1306_WHITE);
            int cx = 106, cy = 31;
          
            if (weatherCode == 0) {
              // Trời nắng: Mặt trời + 8 tia sáng xoay tròn
              display.drawCircle(cx, cy, 6, SSD1306_WHITE);
              float angleBase = (nowMs % 6000UL) / 6000.0f * 6.28318f;
              for (int i = 0; i < 8; i++) {
                float a = angleBase + i * 0.78539f;
                int x1 = cx + cos(a) * 8;
                int y1 = cy + sin(a) * 8;
                int x2 = cx + cos(a) * 12;
                int y2 = cy + sin(a) * 12;
                display.drawLine(x1, y1, x2, y2, SSD1306_WHITE);
              }
            } else {
              // Hiệu ứng đám mây trôi ngang
              int drift = (int)(sin(nowMs / 600.0f) * 3.0f);
              display.fillCircle(cx - 5 + drift, cy + 1, 4, SSD1306_WHITE);
              display.fillCircle(cx + drift, cy - 2, 6, SSD1306_WHITE);
              display.fillCircle(cx + 5 + drift, cy + 1, 4, SSD1306_WHITE);
              display.fillRect(cx - 5 + drift, cy + 1, 10, 5, SSD1306_WHITE);
          
              // Nếu trời mưa: vẽ các hạt mưa rơi xuống
              if (weatherCode >= 50) {
                for (int d = 0; d < 3; d++) {
                  int dropY = cy + 7 + ((nowMs / 40 + d * 4) % 9);
                  int dropX = cx - 5 + d * 5 + drift;
                  display.drawLine(dropX, dropY, dropX - 1, dropY + 3, SSD1306_WHITE);
                }
              }
            }
          
            // Nhiệt độ hiện tại
            display.setTextSize(1);
            display.setCursor(92, 52);
            display.print(String((int)round(currentTempC)) + "C");
          }
          
          void drawHomeClockScreen(unsigned long nowMs) {
            struct tm timeinfo;
            char timeStr[6] = "10:30";
            char secStr[4]  = ":00";
            char dateStr[16] = "30/10/2026";
          
            if (getLocalTime(&timeinfo, 10)) {
              strftime(timeStr, sizeof(timeStr), "%H:%M", &timeinfo);
              strftime(secStr, sizeof(secStr), ":%S", &timeinfo);
              strftime(dateStr, sizeof(dateStr), "%d/%m/%Y", &timeinfo);
            }
          
            // Giờ:Phút cỡ lớn
            display.setTextSize(2);
            display.setTextColor(SSD1306_WHITE);
            display.setCursor(2, 22);
            display.print(timeStr);
          
            // Giây cỡ nhỏ
            display.setTextSize(1);
            display.setCursor(63, 22);
            display.print(secStr);
          
            // Ngày tháng năm
            display.setCursor(4, 44);
            display.print(dateStr);
          
            // Trạng thái Wi-Fi
            display.setCursor(4, 55);
            display.print(WiFi.SSID().substring(0, 12));
          
            drawAnimatedWeatherWidget(nowMs);
          }
          
          // --------------------- HIỆU ỨNG 3D CORNER POPUP (GIỐNG iOS) ---------------------
          void draw3dNotificationPopup(unsigned long nowMs) {
            unsigned long elapsed = nowMs - popup.startMs;
            if (elapsed >= popup.durationMs) {
              popup.active = false;
              return;
            }
          
            // Tính hệ số nội suy Ease-Out (bung từ góc trên trái & thu về góc)
            float t = 1.0f;
            if (elapsed < 400UL) {
              t = elapsed / 400.0f;
            } else if (popup.durationMs - elapsed < 380UL) {
              t = (popup.durationMs - elapsed) / 380.0f;
            }
            float ease = 1.0f - pow(1.0f - t, 3); // Cubic ease-out
          
            int bx = 2;
            int by = 2 + (int)(ease * 8);
            int bw = 14 + (int)(ease * 108);
            int bh = 8  + (int)(ease * 44);
          
            // Xóa nền & vẽ bóng đổ 3D cạnh dưới + cạnh phải
            display.fillRoundRect(bx, by, bw + 3, bh + 3, 4, SSD1306_BLACK);
            display.drawRoundRect(bx + 2, by + 2, bw, bh, 4, SSD1306_WHITE);
            display.fillRoundRect(bx, by, bw, bh, 4, SSD1306_BLACK);
            display.drawRoundRect(bx, by, bw, bh, 4, SSD1306_WHITE);
          
            if (ease > 0.6f) {
              // Thanh tiêu đề đảo màu (Logo + Tên App + Tên người gửi)
              display.fillRoundRect(bx + 2, by + 2, bw - 4, 12, 2, SSD1306_WHITE);
              display.setTextColor(SSD1306_BLACK);
              display.setTextSize(1);
              display.setCursor(bx + 5, by + 4);
              String title = "[" + popup.app.substring(0, 4) + "] " + popup.sender;
              display.print(title.substring(0, 18));
          
              // Nội dung tin nhắn (tự động cuộn dọc mượt mà nếu dài)
              display.setTextColor(SSD1306_WHITE);
              int charsPerLine = 19;
              int totalLines = (popup.msg.length() + charsPerLine - 1) / charsPerLine;
              int maxScrollPx = max(0, (totalLines - 2) * 10);
              int scrollY = 0;
              if (elapsed > 1500UL && maxScrollPx > 0) {
                unsigned long scrollDur = popup.durationMs - 2200UL;
                scrollY = min(maxScrollPx, (int)((elapsed - 1500UL) * maxScrollPx / max(1000UL, scrollDur)));
              }
          
              for (int line = 0; line < totalLines; line++) {
                int lineY = by + 18 + line * 10 - scrollY;
                if (lineY >= by + 15 && lineY <= by + bh - 9) {
                  display.setCursor(bx + 5, lineY);
                  int startIdx = line * charsPerLine;
                  int endIdx = min((int)popup.msg.length(), startIdx + charsPerLine);
                  display.print(popup.msg.substring(startIdx, endIdx));
                }
              }
            }
          }
          
          // --------------------- CHẾ ĐỘ CHỮ TÙY CHỈNH & ICON DỄ THƯƠNG ---------------------
          void drawCustomViewScreen(unsigned long nowMs) {
            if (!customView.pinned && (nowMs - customView.startMs >= customView.durationMs)) {
              customView.active = false;
              return;
            }
            display.drawRoundRect(2, 15, 124, 47, 4, SSD1306_WHITE);
          
            // Hiệu ứng nhịp đập cho icon dễ thương
            int bounceY = (int)(sin(nowMs / 200.0f) * 2.0f);
            display.drawBitmap(10, 28 + bounceY, bmp_heart_16x16, 16, 16, SSD1306_WHITE);
          
            display.setTextSize(1);
            display.setTextColor(SSD1306_WHITE);
            display.setCursor(32, 30);
            display.print(customView.text.substring(0, 15));
            if (customView.text.length() > 15) {
              display.setCursor(32, 42);
              display.print(customView.text.substring(15, 30));
            }
          }
          
          void setup() {
            Serial.begin(115200);
            Wire.begin(I2C_SDA_PIN, I2C_SCL_PIN);
            pinMode(BAT_ADC_PIN, INPUT);
          
            if (!display.begin(SSD1306_SWITCHCAPVCC, OLED_I2C_ADDR)) {
              for (;;);
            }
            display.clearDisplay();
            display.display();
          
            // Đọc Wi-Fi đã lưu trong Flash
            preferences.begin("wifi_cfg", true);
            String savedSsid = preferences.getString("ssid", "");
            String savedPass = preferences.getString("pass", "");
            preferences.end();
          
            if (savedSsid.length() > 0) {
              WiFi.mode(WIFI_STA);
              WiFi.begin(savedSsid.c_str(), savedPass.c_str());
              unsigned long startWait = millis();
              while (WiFi.status() != WL_CONNECTED && millis() - startWait < 10000UL) {
                delay(250);
              }
            }
          
            if (WiFi.status() == WL_CONNECTED) {
              isApConfigMode = false;
              configTime(gmtOffset_sec, daylightOffset_sec, ntpServer);
              fetchLocalWeather();
              initBleServer();
            } else {
              // Chưa có Wi-Fi hoặc kết nối thất bại -> Phát Wi-Fi "ESP32-SmartWatch" (192.168.4.1)
              startSoftApPortal();
              initBleServer();
            }
          }
          
          void loop() {
            if (isApConfigMode) {
              server.handleClient();
            } else {
              if (millis() - lastWeatherUpdateMs > 900000UL) { // Cập nhật thời tiết mỗi 15 phút
                lastWeatherUpdateMs = millis();
                fetchLocalWeather();
              }
            }
          
            updateBatteryStatus();
          
            // Render GUI ở tốc độ ~30 FPS (mỗi 33ms) không dùng delay()
            unsigned long nowMs = millis();
            if (nowMs - lastFrameMs >= 33UL) {
              lastFrameMs = nowMs;
              display.clearDisplay();
              drawStatusBar();
          
              if (isApConfigMode) {
                display.setTextSize(1);
                display.setCursor(6, 20);
                display.print("WIFI: ESP32-SmartWatch");
                display.drawRoundRect(6, 36, 116, 18, 3, SSD1306_WHITE);
                display.setCursor(14, 41);
                display.print("IP: 192.168.4.1");
              } else if (customView.active) {
                drawCustomViewScreen(nowMs);
              } else {
                drawHomeClockScreen(nowMs);
              }
          
              if (popup.active) {
                draw3dNotificationPopup(nowMs);
              }
          
              display.display();
            }
          }
              """.trimIndent()
          }
