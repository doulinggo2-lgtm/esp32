name: Build ESP32 Smartwatch Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Full Android Project Files
        run: |
          set -e
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -o "$z"; fi
          done
          rm -rf app/src/test app/src/androidTest
          mkdir -p app/src/main/java/com/example/ui/theme
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat << 'EOF_FILE_BLOCK' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF_FILE_BLOCK
          cat << 'EOF_FILE_BLOCK' > settings.gradle.kts
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "ESP32SmartWatchBLE"
          include(":app")
          EOF_FILE_BLOCK
          cat << 'EOF_FILE_BLOCK' > build.gradle.kts
          plugins {
            id("com.android.application") version "8.7.2" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
            id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_FILE_BLOCK
          cat << 'EOF_FILE_BLOCK' > app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
          }
          
          android {
            namespace = "com.example"
            compileSdk = 35
          
            defaultConfig {
              applicationId = "com.example.esp32smartwatch"
              minSdk = 26
              targetSdk = 35
              versionCode = 1
              versionName = "1.0"
            }
          
            buildTypes {
              release {
                isMinifyEnabled = false
              }
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
              jvmTarget = "17"
            }
            buildFeatures {
              compose = true
            }
          }
          
          dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
            implementation(composeBom)
            implementation("androidx.core:core-ktx:1.15.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
            implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
            implementation("androidx.activity:activity-compose:1.9.3")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-core")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF_FILE_BLOCK
          cat << 'EOF_FILE_BLOCK' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
          
              <!-- Quyền mạng để cấu hình Wi-Fi ESP32 qua http://192.168.4.1 -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          
              <!-- Quyền Bluetooth Low Energy (BLE) cho Android 11 trở xuống -->
              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.ACCESS_COARSE_LOCATION"
                  android:maxSdkVersion="30" />
          
              <!-- Quyền Bluetooth Low Energy (BLE) cho Android 12+ (API 31+) -->
              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"
                  tools:targetApi="s" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          
              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />
          
              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.MyApplication">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:theme="@style/Theme.MyApplication">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
          
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <!-- Dịch vụ lắng nghe thông báo Zalo, Messenger, SMS và đẩy sang ESP32 qua BLE -->
                  <service
                      android:name=".SmartWatchNotificationService"
                      android:exported="true"
                      android:label="ESP32 Smartwatch Notification Sync"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          
          </manifest>
          EOF_FILE_BLOCK
