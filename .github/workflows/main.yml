              /**
               * Đẩy thông báo điện thoại (Zalo, Messenger, SMS...) lên màn hình OLED (Hiệu ứng 3D Corner Popup)
               * và truyền gói JSON qua BLE xuống mạch ESP32 thật nếu đang kết nối.
               */
              fun sendPhoneNotification(appName: String, sender: String, message: String) {
                  val processedSender = if (_state.value.stripVietnameseAccents) {
                      removeVietnameseAccents(sender)
                  } else {
                      sender
                  }
                  val processedMsg = if (_state.value.stripVietnameseAccents) {
                      removeVietnameseAccents(message)
                  } else {
                      message
                  }
          
                  val jsonObj = JSONObject().apply {
                      put("type", "notif")
                      put("app", appName)
                      put("sender", processedSender.take(36))
                      put("msg", processedMsg.take(220))
                  }
                  val jsonString = jsonObj.toString()
          
                  // Tính thời gian hiển thị dựa trên độ dài tin nhắn để kịp cuộn hết dòng
                  val extraScrollMs = ((processedMsg.length - 30).coerceAtLeast(0) * 65L).coerceAtMost(9000L)
                  val totalDuration = 6500L + extraScrollMs
          
                  val popup = NotificationPopupState(
                      appName = appName,
                      sender = processedSender,
                      message = processedMsg,
                      startTimeMs = System.currentTimeMillis(),
                      durationMs = totalDuration
                  )
          
                  val timeFormat = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  val sentBle = writeJsonToBle(jsonString)
          
                  val logEntry = NotificationLogItem(
                      time = timeFormat,
                      appName = appName,
                      sender = processedSender,
                      message = processedMsg,
                      rawJson = jsonString,
                      sentViaBle = sentBle
                  )
          
                  _state.value = _state.value.copy(
                      activePopup = popup,
                      isSoftApMode = false,
                      lastJsonPayload = jsonString,
                      notificationLogs = (listOf(logEntry) + _state.value.notificationLogs).take(25)
                  )
              }
          
              /**
               * Gửi chữ tùy chỉnh (ví dụ: tên một người đặc biệt) + Icon hoạt họa dễ thương lên màn hình ESP32.
               */
              fun sendCustomDisplay(text: String, icon: CuteIconType, pinned: Boolean, durationSec: Int = 15) {
                  val cleanText = text.ifBlank { "Yêu em nhiều!" }
                  val finalText = if (_state.value.stripVietnameseAccents) {
                      removeVietnameseAccents(cleanText)
                  } else {
                      cleanText
                  }
          
                  val jsonObj = JSONObject().apply {
                      put("type", "custom")
                      put("text", finalText.take(60))
                      put("icon", icon.id)
                      put("pinned", pinned)
                      put("duration", if (pinned) 0 else durationSec)
                  }
                  val jsonString = jsonObj.toString()
                  writeJsonToBle(jsonString)
          
                  _state.value = _state.value.copy(
                      activeCustomDisplay = CustomDisplayState(
                          text = finalText,
                          icon = icon,
                          pinned = pinned,
                          startTimeMs = System.currentTimeMillis(),
                          durationMs = if (pinned) Long.MAX_VALUE else durationSec * 1000L
                      ),
                      activePopup = null,
                      isSoftApMode = false,
                      lastJsonPayload = jsonString
                  )
              }
          
              fun clearCustomDisplay() {
                  val jsonString = """{"type":"home"}"""
                  writeJsonToBle(jsonString)
                  _state.value = _state.value.copy(
                      activeCustomDisplay = null,
                      activePopup = null,
                      lastJsonPayload = jsonString
                  )
              }
          
              fun removeVietnameseAccents(str: String): String {
                  val temp = Normalizer.normalize(str, Normalizer.Form.NFD)
                  val pattern = Pattern.compile("\\p{InCombiningDiacriticalMarks}+")
                  return pattern.matcher(temp)
                      .replaceAll("")
                      .replace('đ', 'd')
                      .replace('Đ', 'D')
              }
          
              @SuppressLint("MissingPermission")
              fun startBleScanAndConnect(context: Context) {
                  val bluetoothManager = context.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
                  val adapter: BluetoothAdapter? = bluetoothManager?.adapter
          
                  if (adapter == null || !adapter.isEnabled) {
                      _state.value = _state.value.copy(
                          bleStatusText = "Bluetooth đang tắt trên điện thoại (Đang chạy chế độ Mô phỏng trực tiếp)",
                          isBleScanning = false
                      )
                      return
                  }
          
                  val scanner = adapter.bluetoothLeScanner
                  if (scanner == null) {
                      _state.value = _state.value.copy(
                          bleStatusText = "Thiết bị không hỗ trợ BLE Scanner (Đang chạy chế độ Mô phỏng)",
                          isBleScanning = false
                      )
                      return
                  }
          
                  _state.value = _state.value.copy(
                      isBleScanning = true,
                      bleStatusText = "Đang quét tìm thiết bị \"$ESP32_DEVICE_NAME\"..."
                  )
          
                  val scanCallback = object : ScanCallback() {
                      override fun onScanResult(callbackType: Int, result: ScanResult) {
                          val device: BluetoothDevice = result.device
                          val name = device.name ?: result.scanRecord?.deviceName ?: ""
                          val hasService = result.scanRecord?.serviceUuids?.any { it.uuid == SERVICE_UUID } == true
          
                          if (name.contains("ESP32", ignoreCase = true) || hasService) {
                              try {
                                  scanner.stopScan(this)
                              } catch (_: Exception) {
                              }
                              _state.value = _state.value.copy(
                                  isBleScanning = false,
                                  bleStatusText = "Đã tìm thấy ${name.ifBlank { device.address }}, đang kết nối GATT..."
                              )
                              connectToGattDevice(context, device)
                          }
                      }
          
                      override fun onScanFailed(errorCode: Int) {
                          _state.value = _state.value.copy(
                              isBleScanning = false,
                              bleStatusText = "Không thể quét BLE (Mã lỗi $errorCode) — Bạn vẫn có thể test trên OLED Simulator"
                          )
                      }
                  }
          
                  try {
                      val settings = ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                          .build()
                      scanner.startScan(null, settings, scanCallback)
          
                      mainHandler.postDelayed({
                          if (_state.value.isBleScanning) {
                              try {
                                  scanner.stopScan(scanCallback)
                              } catch (_: Exception) {
                              }
                              _state.value = _state.value.copy(
                                  isBleScanning = false,
                                  bleStatusText = "Không tìm thấy mạch ESP32 quanh đây (Đang chạy chế độ Mô phỏng OLED)"
                              )
                          }
                      }, 8000L)
                  } catch (e: SecurityException) {
                      _state.value = _state.value.copy(
                          isBleScanning = false,
                          bleStatusText = "Cần cấp quyền Bluetooth (Nearby Devices) để kết nối mạch ESP32 thật"
                      )
                  }
              }
          
              @SuppressLint("MissingPermission")
              private fun connectToGattDevice(context: Context, device: BluetoothDevice) {
                  bluetoothGatt?.close()
                  bluetoothGatt = device.connectGatt(context, false, object : BluetoothGattCallback() {
                      override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                          if (newState == BluetoothProfile.STATE_CONNECTED) {
                              gatt.requestMtu(512)
                              gatt.discoverServices()
                              _state.value = _state.value.copy(
                                  isBleConnected = true,
                                  connectedDeviceName = device.name ?: ESP32_DEVICE_NAME,
                                  connectedDeviceAddress = device.address,
                                  bleStatusText = "Đã kết nối BLE: ${device.name ?: ESP32_DEVICE_NAME} (${device.address})"
                              )
                          } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                              writeCharacteristic = null
                              _state.value = _state.value.copy(
                                  isBleConnected = false,
                                  connectedDeviceName = null,
                                  connectedDeviceAddress = null,
                                  bleStatusText = "Đã ngắt kết nối BLE với ESP32 (Đang chạy chế độ Mô phỏng)"
                              )
                          }
                      }
          
                      override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                          if (status == BluetoothGatt.GATT_SUCCESS) {
                              val service = gatt.getService(SERVICE_UUID)
                              writeCharacteristic = service?.getCharacteristic(CHAR_UUID)
                          }
                      }
                  })
              }
          
              @SuppressLint("MissingPermission")
              fun disconnectBle() {
                  try {
                      bluetoothGatt?.disconnect()
                      bluetoothGatt?.close()
                  } catch (_: Exception) {
                  }
                  bluetoothGatt = null
                  writeCharacteristic = null
                  _state.value = _state.value.copy(
                      isBleConnected = false,
                      connectedDeviceName = null,
                      connectedDeviceAddress = null,
                      bleStatusText = "Đã ngắt kết nối BLE (Chế độ Mô phỏng OLED đang bật)"
                  )
              }
          
              @SuppressLint("MissingPermission")
              private fun writeJsonToBle(json: String): Boolean {
                  val gatt = bluetoothGatt ?: return false
                  val characteristic = writeCharacteristic ?: return false
                  return try {
                      val payloadBytes = json.toByteArray(Charsets.UTF_8)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          gatt.writeCharacteristic(
                              characteristic,
                              payloadBytes,
                              BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                          )
                      } else {
                          @Suppress("DEPRECATION")
                          characteristic.value = payloadBytes
                          @Suppress("DEPRECATION")
                          gatt.writeCharacteristic(characteristic)
                      }
                      true
                  } catch (_: Exception) {
                      false
                  }
              }
          }
